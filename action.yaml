name: dynamo-q
description: Allows you to run DynamoQ server and client in your actions.
branding:
  icon: users
  color: green

inputs:
  action:
    description: 'The action to perform. Options: server-start, client-wait, server-stop'
    required: true
    default: client-wait
  queue-name:
    description: 'The queue name to use for the server. Required for start-server.'
    required: false
    default: ''
  queue-table:
    description: 'The queue table to use for the server. Required for start-server.'
    required: false
    default: 'github-actions-dynamo-q-queue'
  backend:
    description: 'Queue backend to use. Options: aws, gcp'
    required: false
    default: 'aws'
  gcp-project:
    description: 'GCP project ID when using the gcp backend.'
    required: false
    default: ''
  gcp-database:
    description: 'GCP firestore database ID when using the gcp backend.'
    required: false
    default: 'github-dynamoq'
  version:
    description: 'The dynamo-q release to download, for example v2.1.1 or latest. Defaults to the ref the action is used at (morfien101/dynamo-q@v2 downloads the v2 release).'
    required: false
    default: ''
  log-level:
    description: 'The log level to use. Options are: trace, debug, info, warn, error, fatal, panic'
    required: false
    default: 'info'


runs:
  using: composite
  steps:
    - name: download dynamo-q
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [ -z "$VERSION" ]; then
          # The action is checked out at _actions/<owner>/<repo>/<ref>, so the directory name is the ref
          # the workflow used (v2, v2.1.1, ...). Branches and SHAs have no release, so they get latest.
          ref="$(basename "$GITHUB_ACTION_PATH")"
          if [[ "$ref" =~ ^v[0-9] ]]; then VERSION="$ref"; else VERSION="latest"; fi
        fi
        if [ "$VERSION" = "latest" ]; then
          # Plain download redirect, not the rate-limited REST API.
          base_url="https://github.com/morfien101/dynamo-q/releases/latest/download"
        else
          base_url="https://github.com/morfien101/dynamo-q/releases/download/${VERSION}"
        fi
        echo "Using dynamo-q release: $VERSION"

        for payload in "dynamoq_manager_linux_amd64" "dynamoq_waiter_linux_amd64"; do
          # RUNNER_TEMP is emptied per job, so a reused runner can't serve an old binary.
          output_name="${RUNNER_TEMP:-/tmp}/${payload%%_linux_amd64}"
          if [ ! -f "$output_name" ]; then
            echo "Downloading $payload"
            curl -fsSL --retry 5 --retry-all-errors -o "$output_name" "${base_url}/${payload}"
            chmod 550 "$output_name"
          fi
          
          if [[ "$output_name" =~ "manager" ]]; then
            echo "DYNAMOQ_SERVER=$output_name" >> $GITHUB_ENV
          elif [[ "$output_name" =~ "waiter" ]]; then
            echo "DYNAMOQ_WAITER=$output_name" >> $GITHUB_ENV
          fi
        done

    - name: run dynamo-q action
      shell: bash
      run: |
        echo "Running dynamo-q action: ${{ inputs.action }}"
        if [[ "${{ inputs.action }}" == "server-start" ]]; then
          # The manager outlives this step, so its output would be lost from the job log.
          # Write it to a file that client-wait and server-stop print.
          DYNAMOQ_LOG="${RUNNER_TEMP:-/tmp}/dynamoq_manager.log"
          echo "DYNAMOQ_LOG=$DYNAMOQ_LOG" >> $GITHUB_ENV
          # Start the server and pass it to the background
          $DYNAMOQ_SERVER \
          -queue-table "${{ inputs.queue-table }}" \
          -backend "${{ inputs.backend }}" \
          -gcp-project "${{ inputs.gcp-project }}" \
          -firestore-database "${{ inputs.gcp-database }}" \
          -client "${{ github.repository }}-${{ github.run_number }}" \
          -queue-name "${{ inputs.queue-name }}" \
          -log-level "${{ inputs.log-level }}" \
          > "$DYNAMOQ_LOG" 2>&1 &
        elif [[ "${{ inputs.action }}" == "client-wait" ]]; then
          if [ ! -f "${DYNAMOQ_LOG:-}" ]; then
            $DYNAMOQ_WAITER -wait-for-turn
            exit
          fi
          # Stream the manager's log while we wait.
          tail -n +1 -f "$DYNAMOQ_LOG" &
          tail_pid=$!
          rc=0
          $DYNAMOQ_WAITER -wait-for-turn || rc=$?
          sleep 1
          kill $tail_pid 2>/dev/null || true
          # server-stop picks up the log from here.
          echo "DYNAMOQ_LOG_OFFSET=$(( $(wc -c < "$DYNAMOQ_LOG") ))" >> $GITHUB_ENV
          exit $rc
        elif [[ "${{ inputs.action }}" == "server-stop" ]]; then
          $DYNAMOQ_WAITER -shutdown
          # We need to give the server time to shutdown.
          # currently the client just send the signal and exits.
          # It doesn't know when the server has actually stopped.
          sleep 3
          if [ -f "${DYNAMOQ_LOG:-}" ]; then
            echo "::group::dynamo-q manager log"
            tail -c +$(( ${DYNAMOQ_LOG_OFFSET:-0} + 1 )) "$DYNAMOQ_LOG"
            echo "::endgroup::"
          fi
        fi
